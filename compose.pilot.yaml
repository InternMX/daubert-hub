services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      # Smallest mechanism to pass release/build metadata through to the
      # image (see docker/api.Dockerfile and apps/api/src/config/
      # environment.ts). Left unset, both default to "unknown" — set
      # APP_VERSION/GIT_COMMIT in the shell before `docker compose build`
      # (e.g. APP_VERSION=$(node -p "require('./package.json').version")
      # GIT_COMMIT=$(git rev-parse --short HEAD)) to have them baked in.
      args:
        APP_VERSION: "${APP_VERSION:-unknown}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    restart: unless-stopped
    environment:
      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_PORT: "${DB_PORT:?DB_PORT is required}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      API_PORT: "${API_PORT:-3000}"
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pilot

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HUB_PORT:-8080}:80"
    networks:
      - pilot

networks:
  pilot:
    driver: bridge
