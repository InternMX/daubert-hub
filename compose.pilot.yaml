services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      # Smallest mechanism to pass release/build metadata through to the
      # image (see docker/api.Dockerfile and apps/api/src/config/
      # environment.ts). Left unset, both default to "unknown" — set
      # APP_VERSION/GIT_COMMIT in the shell before `docker compose build`
      # (e.g. APP_VERSION=$(node -p "require('./package.json').version")
      # GIT_COMMIT=$(git rev-parse --short HEAD)) to have them baked in.
      args:
        APP_VERSION: "${APP_VERSION:-unknown}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    restart: unless-stopped
    environment:
      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_PORT: "${DB_PORT:?DB_PORT is required}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      API_PORT: "${API_PORT:-3000}"
      # Phase 12C: Hub -> n8n server-to-server webhook for the Caterpillar manual "Reprocesar"
      # control (apps/api/src/config/environment.ts, caterpillarReprocessWebhook). Required, not
      # defaulted: an environment running this stack without a real reprocess URL/token should
      # fail to start rather than silently boot with the endpoint reporting UPSTREAM_UNAVAILABLE
      # for every request. Values come only from the env file passed via --env-file (see
      # deploy/README.md) — never hardcoded here, never committed.
      CATERPILLAR_REPROCESS_WEBHOOK_URL: "${CATERPILLAR_REPROCESS_WEBHOOK_URL:?CATERPILLAR_REPROCESS_WEBHOOK_URL is required}"
      CATERPILLAR_REPROCESS_WEBHOOK_TOKEN: "${CATERPILLAR_REPROCESS_WEBHOOK_TOKEN:?CATERPILLAR_REPROCESS_WEBHOOK_TOKEN is required}"
      # Hub -> n8n availability check (GET /api/system/status, apps/api/src/system). Optional by
      # design: unset reports "n8n sin configurar" in the UI instead of blocking startup. The
      # token is the value of the n8n "Daubert Hub - n8n PROD" Header Auth credential and comes
      # only from the untracked env file passed via --env-file — never committed.
      N8N_HEALTH_WEBHOOK_URL: "${N8N_HEALTH_WEBHOOK_URL:-}"
      N8N_HEALTH_WEBHOOK_TOKEN: "${N8N_HEALTH_WEBHOOK_TOKEN:-}"
      # Notificaciones de pago: reproceso Hub -> n8n y asignacion puntual por archivo. Todo opcional y APAGADO por defecto: con estas
      # variables vacias el Hub se comporta exactamente como antes. PRODUCCION usa sus propias banderas (PAYMENT_FILE_ASSIGNMENTS_PROD_*);
      # las banderas *_TEST_* no se pasan a este contenedor y jamas activan produccion. Ver docs/automations/payment-notifications/production-rollout.md.
      PAYMENT_NOTIFICATIONS_REPROCESS_WEBHOOK_URL: "${PAYMENT_NOTIFICATIONS_REPROCESS_WEBHOOK_URL:-}"
      PAYMENT_NOTIFICATIONS_WEBHOOK_TOKEN: "${PAYMENT_NOTIFICATIONS_WEBHOOK_TOKEN:-}"
      PAYMENT_FILE_ASSIGNMENTS_PROD_ENABLED: "${PAYMENT_FILE_ASSIGNMENTS_PROD_ENABLED:-false}"
      PAYMENT_FILE_ASSIGNMENTS_PROD_N8N_READY: "${PAYMENT_FILE_ASSIGNMENTS_PROD_N8N_READY:-false}"
      PAYMENT_FILE_ASSIGNMENTS_PROD_N8N_ORIGIN: "${PAYMENT_FILE_ASSIGNMENTS_PROD_N8N_ORIGIN:-}"
      # Manufactura (hojas de manufactura). Habilitacion EXPLICITA por entorno (apps/api/src/config/environment.ts, resolveManufacturing): con la base de PRODUCCION queda APAGADA salvo
      # MANUFACTURING_ENABLED=true Y MANUFACTURING_EMISSION_ENV=PRODUCCION; con la base de TEST se habilita sola. Vacias = no declaradas. BIND: claves opcionales (sin ellas la consulta informa
      # NOT_CONFIGURED); BIND_API_BASE_URL se deja vacia salvo necesidad. Chromium y fuentes vienen en la imagen (docker/api.Dockerfile): MANUFACTURING_PDF_CHROME_PATH no se configura aqui.
      MANUFACTURING_ENABLED: "${MANUFACTURING_ENABLED:-}"
      MANUFACTURING_EMISSION_ENV: "${MANUFACTURING_EMISSION_ENV:-}"
      BIND_API_KEY: "${BIND_API_KEY:-}"
      BIND_SUBSCRIPTION_KEY: "${BIND_SUBSCRIPTION_KEY:-}"
      BIND_API_BASE_URL: "${BIND_API_BASE_URL:-}"
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pilot

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # Interfaz de Manufactura: APAGADA por omision (variables de COMPILACION de Vite). Para habilitarla: VITE_MANUFACTURING_UI=true y VITE_MANUFACTURING_DOCUMENTS=true al construir.
      args:
        VITE_MANUFACTURING_UI: "${VITE_MANUFACTURING_UI:-false}"
        VITE_MANUFACTURING_DOCUMENTS: "${VITE_MANUFACTURING_DOCUMENTS:-false}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HUB_PORT:-8080}:80"
    networks:
      - pilot

networks:
  pilot:
    driver: bridge
