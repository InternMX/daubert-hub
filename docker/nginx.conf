server {
    listen 80;
    server_name _;

    # Minor hardening: stop advertising the nginx version in the Server
    # header and on generated error pages. Not an attempt to hide that this
    # is nginx (that would still be obvious from other behavior) — just
    # removes a free, low-effort fingerprinting detail.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Alta de firmas de Manufactura (multipart): el API acepta archivos de hasta 2 MB (apps/api/src/manufacturing-documents/signature-image.ts, MAX_ENTRADA_BYTES);
    # con el límite por omisión de nginx (1 MB) una firma legítima de 1-2 MB recibiría 413 antes de llegar al API. 3 MB = 2 MB + sobrecarga multipart. Solo esta ruta exacta.
    location = /api/manufacturing-sheets/documents/signatures {
        client_max_body_size 3m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
