      <svg class="dibujo-bolsa-svg" viewBox="0 0 400.4 189.8" role="img" aria-label="Dibujo de la bolsa con fuelles: ancho, largo y fuelles izquierdo y derecho">
        <defs>
          <marker id="@{id}" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#4A7EBB"/>
          </marker>
          <!-- Cotas internas de los fuelles: color independiente ({{color_cotas_internas_hex}}) para conservar el contraste con el relleno de la bolsa. -->
          <marker id="@{id}-interna" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="{{color_cotas_internas_hex}}"/>
          </marker>
        </defs>

        <!-- Bolsa -->
        <rect class="bolsa" x="147.72" y="26.95" width="229.49" height="149.31" fill="{{color_bolsa_hex}}" stroke="#000" stroke-width="0.84"/>
        <!-- Límites de los fuelles -->
        <line x1="233.13" y1="27" x2="233.13" y2="176" stroke="#000" stroke-width="0.84" stroke-dasharray="2.5 2"/>
        <line x1="281.13" y1="27" x2="281.13" y2="176" stroke="#000" stroke-width="0.84" stroke-dasharray="2.5 2"/>

        <!-- Cotas -->
        <line x1="151.01" y1="20.7" x2="376.54" y2="20.7" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <line x1="132.5" y1="29.08" x2="132.5" y2="174.83" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <line class="cota-interna" x1="151.68" y1="43" x2="232.56" y2="43" stroke="{{color_cotas_internas_hex}}" stroke-width="0.9" marker-start="url(#@{id}-interna)" marker-end="url(#@{id}-interna)"/>
        <line class="cota-interna" x1="285.0" y1="40.5" x2="371.95" y2="40.5" stroke="{{color_cotas_internas_hex}}" stroke-width="0.9" marker-start="url(#@{id}-interna)" marker-end="url(#@{id}-interna)"/>
        <text x="260.9" y="7.5" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{ancho}}</text>
        <text x="116.1" y="94.1" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{largo}}</text>
        <text x="190.8" y="61.7" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{fuelle_izquierdo}}</text>
        <text x="329.6" y="61.7" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{fuelle_derecho}}</text>

        <!-- Barra inferior (fija) -->
        <rect x="75.70" y="176.14" width="324.67" height="13.68" fill="#244062"/>
      </svg>
