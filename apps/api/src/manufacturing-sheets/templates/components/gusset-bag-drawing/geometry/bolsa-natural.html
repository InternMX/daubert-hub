      <!-- DIBUJO DE BOLSA CON FUELLES de BOLSA_NATURAL: misma geometría de cuerpo, fuelles punteados y cotas que BOLSA_FUELLE (ancho arriba, largo a la
           izquierda y un fuelle a cada lado dentro de la bolsa), pero con un sello de fondo plano y frontal en lugar de la barra inferior azul.
           El relleno lo entrega el backend en {{color_bolsa_hex}}: no se asocia «Natural» con ningún color sin confirmación de Manufactura. -->
      <svg class="dibujo-bolsa-svg" viewBox="0 0 400.4 184" role="img" aria-label="Dibujo de la bolsa con fuelles: ancho, largo y fuelles izquierdo y derecho">
        <defs>
          <marker id="@{id}" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#4A7EBB"/>
          </marker>
          <!-- Cotas internas de los fuelles: color independiente ({{color_cotas_internas_hex}}) para conservar el contraste con el relleno de la bolsa. -->
          <marker id="@{id}-interna" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="{{color_cotas_internas_hex}}"/>
          </marker>
        </defs>

        <!-- Bolsa (esquemática, sin escala): cuerpo con fuelle izquierdo y derecho simétricos y franja central. Relleno: {{color_bolsa_hex}}. -->
        <rect class="bolsa" x="112" y="34" width="270" height="142" fill="{{color_bolsa_hex}}" stroke="#000" stroke-width="0.84"/>
        <!-- Límites de los fuelles -->
        <line x1="216" y1="34" x2="216" y2="176" stroke="#000" stroke-width="0.84" stroke-dasharray="2.5 2"/>
        <line x1="278" y1="34" x2="278" y2="176" stroke="#000" stroke-width="0.84" stroke-dasharray="2.5 2"/>

        <!-- Cotas: ancho (arriba), largo (izquierda) y fuelles (dentro de la bolsa) -->
        <line x1="112" y1="22" x2="382" y2="22" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <line x1="94" y1="34" x2="94" y2="176" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <line class="cota-interna" x1="112" y1="52" x2="216" y2="52" stroke="{{color_cotas_internas_hex}}" stroke-width="0.9" marker-start="url(#@{id}-interna)" marker-end="url(#@{id}-interna)"/>
        <line class="cota-interna" x1="278" y1="52" x2="382" y2="52" stroke="{{color_cotas_internas_hex}}" stroke-width="0.9" marker-start="url(#@{id}-interna)" marker-end="url(#@{id}-interna)"/>
        <text x="247" y="9" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{ancho}}</text>
        <text x="66" y="105" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{largo}}</text>
        <!-- Los textos de los fuelles van sobre una pastilla blanca para leerse con cualquier color de producto -->
        <rect x="142" y="61" width="44" height="14" rx="2" fill="#fff"/>
        <rect x="308" y="61" width="44" height="14" rx="2" fill="#fff"/>
        <text x="164" y="68" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{fuelle_izquierdo}}</text>
        <text x="330" y="68" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{fuelle_derecho}}</text>

        <!-- Sello de fondo (BOLSA_NATURAL): rectángulo delgado (6 pt), plano y frontal, pegado al borde inferior del cuerpo, con el mismo relleno
             ({{color_bolsa_hex}}) y bordes negros marcados; sin sombras, perspectiva ni volumen (no es un prisma) y sin la barra azul fija de
             BOLSA_FUELLE. Esquemático: no hay dimensiones técnicas confirmadas del sello, por eso no se acota. -->
        <rect class="sello-fondo" x="112" y="176" width="270" height="6" fill="{{color_bolsa_hex}}" stroke="#000" stroke-width="1.2"/>
      </svg>
