    <!-- DIBUJO DE PRESENTACIÓN FINAL (TERMOENCOGIBLE): rectángulo horizontal sencillo, contorno negro y fondo blanco (sin color de producto).
         Cota horizontal superior {{largo_presentacion_final}} y cota vertical izquierda {{ancho_presentacion_final}}: datos independientes de
         los campos de medidas principales. Esquemático y sin escala. Parámetros: id (marcador de flecha). -->
    <div class="dibujo-presentacion-final-caja" id="seccion-dibujo-presentacion-final" data-seccion="dibujo-presentacion-final">
      <svg class="dibujo-te-svg" viewBox="0 0 400.4 54" role="img" aria-label="Dibujo de presentación final: largo y ancho">
        <defs>
          <marker id="@{id}" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#4A7EBB"/>
          </marker>
        </defs>
        <text x="200" y="7" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{largo_presentacion_final}}</text>
        <line x1="110" y1="15" x2="290" y2="15" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <rect class="presentacion-final" x="110" y="20" width="180" height="30" fill="#fff" stroke="#000" stroke-width="0.84"/>
        <line x1="92" y1="20" x2="92" y2="50" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <text x="50" y="35" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{ancho_presentacion_final}}</text>
      </svg>
    </div>
