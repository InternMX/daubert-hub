    <!-- DIBUJO DE ROLLO DOBLADO (TERMOENCOGIBLE): figura original del Excel (trazos azules delgados de material doblado, con pliegues) incorporada
         como imagen (images/rollo_doblado_original.png, 746 x 327 px, unos 290 ppp a este tamaño); no es la geometría del rollo continuo.
         Rótulos «Apertura» e «Inicio» y cotas dinámicas {{ancho_doblado}} (horizontal) y {{medida_pliegue}} (adicional), independientes de ancho y largo.
         La posición de los rótulos y de las cotas es provisional hasta contrastarla con la referencia. No se inventan reglas de doblez ni proporciones. -->
    <div class="dibujo-rollo-doblado-caja" id="seccion-dibujo-rollo-doblado" data-seccion="dibujo-rollo-doblado" data-plantilla="termoencogible-doblado">
      <svg class="dibujo-te-svg" viewBox="0 0 400.4 96" role="img" aria-label="Dibujo de rollo doblado: apertura, inicio y cotas">
        <defs>
          <marker id="@{id}" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#4A7EBB"/>
          </marker>
        </defs>
        <text x="200" y="7" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{ancho_doblado}}</text>
        <line x1="138" y1="15" x2="262" y2="15" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <image href="images/rollo_doblado_original.png" x="136" y="20" width="128" height="56" preserveAspectRatio="xMidYMid meet"/>
        <text x="131" y="55" font-size="10.2" fill="#000" text-anchor="end" dominant-baseline="central">Apertura</text>
        <text x="269" y="27" font-size="10.2" fill="#000" text-anchor="start" dominant-baseline="central">Inicio</text>
        <line x1="136" y1="80" x2="166" y2="80" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <text x="151" y="88" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{medida_pliegue}}</text>
      </svg>
    </div>
