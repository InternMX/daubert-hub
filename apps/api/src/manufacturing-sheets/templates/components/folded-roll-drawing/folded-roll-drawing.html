    <!-- DIBUJO DE ROLLO DOBLADO (TERMOENCOGIBLE): figura original del Excel (trazos azules delgados de material doblado, con pliegues) incorporada
         como imagen (images/rollo_doblado_original.png, 746 x 327 px, sin texto «Apertura»: ese rótulo se eliminó a propósito del machote y no debe
         volver a incluirse); no es la geometría del rollo continuo. Anotaciones negras sobre la figura, como en la referencia definitiva:
         «Inicio» con flecha vertical de doble punta junto al vértice frontal izquierdo, cota {{ancho_doblado}} sobre una flecha horizontal en la
         superficie superior y cota {{medida_pliegue}} sobre una flecha diagonal corta en el pliegue inferior derecho. La imagen ocupa todo el alto
         del contenedor menos 1,5 pt de margen arriba y abajo (escala uniforme 93/327): las franjas contiguas se solapan 0,5 pt con el contenedor y el fondo blanco de la imagen no debe tocarlas; no se inventan reglas de doblez ni proporciones. -->
    <div class="dibujo-rollo-doblado-caja" id="seccion-dibujo-rollo-doblado" data-seccion="dibujo-rollo-doblado" data-plantilla="termoencogible-doblado">
      <svg class="dibujo-te-svg" viewBox="0 0 400.4 96" role="img" aria-label="Dibujo de rollo doblado: inicio y cotas">
        <defs>
          <marker id="@{id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#000"/>
          </marker>
        </defs>
        <image href="images/rollo_doblado_original.png" x="94.1" y="1.5" width="212.2" height="93" preserveAspectRatio="xMidYMid meet"/>
        <text x="123.1" y="61.8" font-size="9" fill="#000" text-anchor="end" dominant-baseline="central">Inicio</text>
        <line x1="128.1" y1="56.2" x2="128.1" y2="67.4" stroke="#000" stroke-width="0.8" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <text x="199.6" y="43.2" font-size="9" fill="#000" text-anchor="middle" dominant-baseline="central">{{ancho_doblado}}</text>
        <line x1="153.4" y1="50.0" x2="246.0" y2="50.0" stroke="#000" stroke-width="0.8" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <text x="0" y="0" font-size="7" fill="#000" text-anchor="middle" dominant-baseline="central" transform="translate(232.1 77.5) rotate(20.8)">{{medida_pliegue}}</text>
        <line x1="217.5" y1="79.1" x2="238.2" y2="86.8" stroke="#000" stroke-width="0.8" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
      </svg>
    </div>
