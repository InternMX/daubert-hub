    <!-- TIPO DE HOJA (HOJA_PAQ): Doblada / Extendida. Mismo patrón de selección que Presentación; cada valor llega como "X" o "NA".
         Cuadrícula B:I; va pegada a Datos generales. -->
    <div class="tabla-contenedor seccion-pegada" id="seccion-tipo-hoja" data-seccion="tipo-hoja">
      <table class="t-bi" aria-label="Tipo de hoja">
        <colgroup>
          <col class="g-b"><col class="g-c"><col class="g-d"><col class="g-e">
          <col class="g-f"><col class="g-g"><col class="g-h"><col class="g-i">
        </colgroup>
        <tbody>
          <tr class="alto-136">
            <th class="rotulo" colspan="2" scope="row">Hoja:</th>
            <td class="tipo" colspan="2">Doblada</td><td class="marca" id="hoja_doblada" data-valor="{{hoja_doblada}}">{{hoja_doblada}}</td>
            <td class="tipo" colspan="2">Extendida</td><td class="marca" id="hoja_extendida" data-valor="{{hoja_extendida}}">{{hoja_extendida}}</td>
          </tr>
        </tbody>
      </table>
    </div>
