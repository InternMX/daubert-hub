    <!-- DIBUJO HOJA (HOJA_PAQ): hoja plana rectangular, sin fuelles. Esquemático y sin escala: las cotas comunican las medidas.
         Cota horizontal {{ancho}}, cota vertical {{largo}}; relleno {{color_bolsa_hex}} (código CSS del producto).
         Igual para hoja doblada y extendida. Parámetros: id (marcador de flecha, único en el documento). -->
    <div class="dibujo-hoja-caja" id="seccion-dibujo-hoja" data-seccion="dibujo-hoja">
      <svg class="dibujo-svg" viewBox="0 0 400.4 92" role="img" aria-label="Dibujo de la hoja: ancho y largo">
        <defs>
          <marker id="@{id}" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#4A7EBB"/>
          </marker>
        </defs>
        <text x="200" y="7" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{ancho}}</text>
        <line x1="90" y1="17" x2="310" y2="17" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <rect class="hoja-plana" x="90" y="23" width="220" height="63" fill="{{color_bolsa_hex}}" stroke="#000" stroke-width="0.84"/>
        <line x1="72" y1="23" x2="72" y2="86" stroke="#4A7EBB" stroke-width="0.9" marker-start="url(#@{id})" marker-end="url(#@{id})"/>
        <text x="36" y="54.5" font-size="10.2" fill="#000" text-anchor="middle" dominant-baseline="central">{{largo}}</text>
      </svg>
    </div>
