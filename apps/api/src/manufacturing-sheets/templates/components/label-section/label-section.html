    <!-- SECCIÓN DIBUJO BOLSA (encabezado: franja azul claro de B a K) + ETIQUETA (B:I) · cuadrícula B:K de la tabla general.
         El dibujo técnico (SVG) se incorporará posteriormente. -->
    <div class="tabla-contenedor seccion-pegada" id="seccion-etiqueta" data-seccion="dibujo-bolsa-etiqueta">
      <table class="t-general" aria-label="Dibujo de la bolsa y etiqueta">
        <colgroup>
          <col class="k-b"><col class="k-c"><col class="k-d"><col class="k-e">
          <col class="k-f"><col class="k-g"><col class="k-h"><col class="k-i">
          <col class="k-j"><col class="k-k">
        </colgroup>
        <tbody id="encabezado-dibujo-bolsa">
          <tr>
            <th class="seccion-titulo titulo-claro titulo-dibujo" colspan="10" scope="col">Dibujo Bolsa</th>
          </tr>
        </tbody>
        <tbody id="seccion-etiqueta-valor">
          <tr>
            <td class="etiqueta-seccion" colspan="8" id="etiqueta"><strong>Etiqueta:</strong> {{etiqueta}}</td>
          </tr>
        </tbody>
      </table>
    </div>
