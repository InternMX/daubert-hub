# Entry-closure policy (Hub Web / Nginx) for the joint Pagos + Caterpillar window. APPROVED design: 1,373 HTTP checks PASS on real Nginx 1.31.6 (two Web images, recreation and rollback).
# Installed as the ONLY file (default.conf) of the externally mounted conf.d directory, read-only, by deploy/closure/entry-closure-override.yaml; see scripts/deploy/Set-EntryClosure.ps1.
# Writes (anything but GET/HEAD/OPTIONS) to Payment and Caterpillar namespaces, CAT folios, payment settings and company alias edits answer 503. Everything else (Audi, auth, health, reads) is untouched.
map "$request_method:$http_x_hub_window_probe" $hub_window_check_method {
    default $request_method;
    "GET:POST" POST;
    "GET:PUT" PUT;
    "GET:PATCH" PATCH;
    "GET:DELETE" DELETE;
    "GET:TRACE" TRACE;
    "GET:CONNECT" CONNECT;
}

map $hub_window_check_method $hub_window_write {
    default 1;
    GET 0;
    HEAD 0;
    OPTIONS 0;
}

map $uri $hub_window_target {
    default 0;
    ~*^/api/automations/(?:payment-notifications|remissions/caterpillar)(?:/|$) 1;
    ~*^/api/automations/(?:REMISIONES_CATERPILLAR|PAYMENT_NOTIFICATIONS)/(?:document-series|review-acknowledgements)(?:/|$) 1;
    ~*^/api/companies/[^/]+/(?:payment-notification-settings|aliases)(?:/|$) 1;
    ~*^/api/aliases/[^/]+/payment-notifications(?:/|$) 1;
}

map "$hub_window_write:$hub_window_target" $hub_window_deny {
    default 0;
    "1:1" 1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Hub-Window "closed-v1" always;
    if ($hub_window_deny) {
        return 503;
    }

    location = /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
